<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ BlackBurn — Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body">
<header class="top"><a class="logo" href="/">DJ <span>BlackBurn</span></a><a href="/">← Ver site</a></header>
<main class="admin-wrap">
<section id="loginBox" class="panel login"><h1>Área reservada</h1><p>Administração das tuas músicas e eventos.</p>
<form id="loginForm"><input id="password" type="password" placeholder="Palavra-passe" required><button class="btn">ENTRAR</button><p id="loginMsg" class="msg"></p></form></section>
<section id="dash" class="hidden">
<div class="admin-head"><div><p class="eyebrow">ADMIN</p><h1>DJ BLACKBURN</h1></div><button id="logout" class="btn ghost">SAIR</button></div>

<section class="panel"><h2 id="formTitle">Adicionar música</h2>
<form id="songForm" enctype="multipart/form-data"><input type="hidden" id="songId">
<div class="form-grid"><label>Título<input id="title" name="title" required></label><label>Artista<input id="artist" name="artist" value="DJ BlackBurn"></label>
<label>Género<input id="genre" name="genre" placeholder="Afro House"></label><label>Ano<input id="year" name="year" inputmode="numeric"></label></div>
<label>Descrição<textarea id="description" name="description" rows="4"></textarea></label>
<div class="form-grid"><label>Ficheiro de música<input id="audio" name="audio" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,audio/*"></label><label>Capa<input id="cover" name="cover" type="file" accept="image/*"></label></div>
<div class="form-actions"><button class="btn" id="saveBtn">GUARDAR MÚSICA</button><button type="button" class="btn ghost hidden" id="cancelEdit">CANCELAR EDIÇÃO</button></div><p id="formMsg" class="msg"></p></form></section>

<section><h2>As tuas músicas</h2><div id="adminSongs" class="admin-list"></div></section>

<section class="panel" style="margin-top:50px"><h2 id="eventFormTitle">Adicionar evento</h2>
<form id="eventForm" enctype="multipart/form-data"><input type="hidden" id="eventId">
<div class="form-grid">
<label>Nome do evento<input id="eventTitle" name="title" placeholder="Ex.: Noite Afro"></label>
<label>Local / sala<input id="eventVenue" name="venue" placeholder="Ex.: Club XYZ"></label>
<label>Cidade<input id="eventCity" name="city" placeholder="Ex.: Lyon"></label>
<label>Data<input id="eventDate" name="event_date" type="date"></label>
<label>Hora<input id="eventTime" name="event_time" type="time"></label>
<label>Cartaz (opcional)<input id="eventPoster" name="poster" type="file" accept="image/*"></label>
</div>
<label>Descrição<textarea id="eventDescription" name="description" rows="3" placeholder="Informações sobre o evento"></textarea></label>
<div class="form-actions"><button class="btn" id="eventSaveBtn">GUARDAR EVENTO</button><button type="button" class="btn ghost hidden" id="cancelEventEdit">CANCELAR</button></div>
<p id="eventMsg" class="msg"></p></form></section>

<section><h2>Próximos eventos</h2><div id="adminEvents" class="admin-list"></div></section>
</section></main>
<script src="/admin.js"></script>
</body></html>
