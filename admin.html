<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ BlackBurn — Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body">
<header class="top"><a class="logo" href="/">DJ <span>BlackBurn</span></a><a href="/">← Ver site</a></header>
<main class="admin-wrap">
<section id="loginBox" class="panel login">
<h1>Área reservada</h1><p>Administração das tuas músicas.</p>
<form id="loginForm"><input id="password" type="password" placeholder="Palavra-passe" required><button class="btn">ENTRAR</button><p id="loginMsg" class="msg"></p></form>
</section>
<section id="dash" class="hidden">
<div class="admin-head"><div><p class="eyebrow">ADMIN</p><h1>MY MUSIC</h1></div><button id="logout" class="btn ghost">SAIR</button></div>
<section class="panel"><h2 id="formTitle">Adicionar música</h2>
<form id="songForm" enctype="multipart/form-data">
<input type="hidden" id="songId">
<div class="form-grid">
<label>Título<input id="title" name="title" required></label>
<label>Artista<input id="artist" name="artist" value="DJ BlackBurn"></label>
<label>Género<input id="genre" name="genre" placeholder="Afro House"></label>
<label>Ano<input id="year" name="year" inputmode="numeric"></label>
</div>
<label>Descrição<textarea id="description" name="description" rows="4"></textarea></label>
<div class="form-grid">
<label>Ficheiro de música (MP3/WAV/M4A/FLAC/OGG...)
<input id="audio" name="audio" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,audio/*"></label>
<label>Capa (JPG/PNG/WEBP)<input id="cover" name="cover" type="file" accept="image/*"></label>
</div>
<div class="form-actions"><button class="btn" id="saveBtn">GUARDAR MÚSICA</button><button type="button" class="btn ghost hidden" id="cancelEdit">CANCELAR EDIÇÃO</button></div>
<p id="formMsg" class="msg"></p>
</form></section>
<section><h2>As tuas músicas</h2><div id="adminSongs" class="admin-list"></div></section>
</section></main>
<script src="/admin.js"></script>
</body></html>
